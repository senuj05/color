<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color</title>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar">
        <div id="sidebar-content" class="sidebar-container">
            <h3>Search Any Location</h3>
            <input type="text" id="input-city" class="input" placeholder="Enter city Name" />
            <button id="search-btn" class="button">Search</button>
            <h3>Weather Information</h3>
            <p id="city">City</p>
            <img id="weather-icon" src="" alt="Weather Icon" width="25px" height="25px" />
            <p><b>Temperature:</b> <span id="temp"></span>°C</p>
            <p><b>Weather:</b> <span id="weather"></span></p>
            <p><b>Wind Speed:</b> <span id="wind-speed"></span> km/h</p>
        </div>
    </div>


    <div id="stage">
        <div id="painting-wrap">
            <img id="painting" alt="Artwork" src="src/Pin by Kay Sanchez on Random in 2022 | Cool wallpapers art, Ethereal art, Art wallpaper.jpg">
        </div>
        <div id="caption">
            <p>Caption for the artwork goes here.</p>
        </div>
    </div>
    <script src="script.js"></script>


</body>
</html>
